name: Canton-RS LocalNet CI Example

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

jobs:
  localnet-smoke:
    runs-on: ubuntu-latest
    env:
      CI_INSTANCE_NAME: ci
      CI_PORT_BASE: "47000"
      CI_STATUS_OUT: ${{ github.workspace }}/ci-status.json
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Build canton-rs
        run: cargo build -p canton-rs --features pg-tests

      - name: Run LocalNet CI pipeline example
        run: bash scripts/ci-localnet-example.sh

      - name: Upload daemon status artifact
        if: always() && hashFiles('ci-status.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: canton-rs-ci-status
          path: ci-status.json
