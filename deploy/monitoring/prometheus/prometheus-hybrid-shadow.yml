# Case 4: Brownfield Side-by-Side (JVM Hub + canton-rs --port-offset 20000 --shadow-verify)
# Usage: PROMETHEUS_CONFIG=./prometheus/prometheus-hybrid-shadow.yml docker compose up -d
global:
  scrape_interval: 2s
  evaluation_interval: 5s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: "canton-rs-shadow-supervisor"
    static_configs:
      - targets:
          - "host.docker.internal:9464"
          - "host.docker.internal:29464"
        labels:
          mode: "shadow-verify"
