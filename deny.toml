# X-4: the supply-chain policy `cargo deny check` reads (run by scripts/verify-supply-chain.sh).
# The license list is the set the 349 registry packages of Cargo.lock need (read from `cargo metadata` on 2026-11-21): for an
# `A OR B` expression one allowed license is enough, an `A AND B` needs both.

[graph]
all-features = false

[advisories]
version = 2
yanked = "deny"

[licenses]
version = 2
confidence-threshold = 0.9
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "CC0-1.0",
    "BSL-1.0",
]

[bans]
# prost 0.13 and 0.14 are both in the tree (X-4): reported, not refused, until the dependency versions are aligned.
multiple-versions = "warn"
# workspace path dependencies carry no version
wildcards = "allow"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
