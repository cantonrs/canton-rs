[package]
name = "ledger-grpc-api"
version = "0.8.1"
edition = "2021"
description = "Ledger API v2 over gRPC for canton-rust: a dynamic (descriptor-driven) server and the oracle client"
license = "Apache-2.0"

[features]
# the options that start the server on an official participant's database and `canton.conf` (U-47)
official = ["ledger-json-api/protocol", "dep:canton-participant"]

[dependencies]
canton-proto = { path = "../../protocol/canton-proto" }
ledger-json-api = { path = "../ledger-json-api" }
canton-participant = { path = "../../core/canton-participant", features = ["sequencer-grpc", "postgres"], optional = true }
tonic = { version = "0.14", features = ["transport", "tls-ring"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time"] }
tokio-stream = "0.1"
prost = "0.14"
prost-reflect = { version = "0.16", features = ["serde"] }
serde_json = "1.0"
http = "1"
tower = "0.5"
bytes = "1"
clap = { version = "4.5", features = ["derive"] }

[dev-dependencies]
canton-sequencer-server = { path = "../../protocol/sequencer-server" }
ed25519-dalek = { version = "2.1", features = ["pkcs8"] }

[lints]
workspace = true
