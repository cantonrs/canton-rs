[package]
name = "canton-algo"
version = "0.8.1"
edition = "2021"
description = "Algorithms read from Canton 3.7.2 and Splice 0.10.1, implemented with ordinary Rust crates"
license = "Apache-2.0"

[dependencies]
sha2 = "0.10"
hex = "0.4"
ed25519-dalek = { version = "2.1", features = ["pkcs8"] }
# the prime-order-subgroup check of Ed25519 public keys (Bouncy Castle's `validatePublicKeyFull`)
curve25519-dalek = "4"
k256 = { version = "0.13", features = ["ecdsa", "pkcs8"] }
p256 = { version = "0.14", features = ["ecdsa", "pkcs8"] }
p384 = { version = "0.14", features = ["ecdsa", "pkcs8"] }
canton-proto = { path = "../../protocol/canton-proto" }
lf-eval = { path = "../lf-eval" }
prost = "0.14"


[lints]
workspace = true
