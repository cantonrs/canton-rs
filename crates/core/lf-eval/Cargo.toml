[package]
name = "lf-eval"
version = "0.8.1"
edition = "2021"
description = "Explicit stack evaluator for a closed Daml-LF expression subset"
license = "Apache-2.0"

[dependencies]
lf-archive = { path = "../lf-archive" }
thiserror = "2.0"
sha2 = "0.10"
hex = "0.4"
k256 = { version = "0.13", features = ["ecdsa", "pkcs8"] }
tiny-keccak = { version = "2.0", features = ["keccak"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
num-bigint = "0.4"
crc32fast = "1"



[dev-dependencies]
zip = { version = "2.2", default-features = false, features = ["deflate"] }

[[bin]]
name = "lf-eval"
path = "src/bin/lf-eval.rs"

[[bin]]
name = "tx-ledger"
path = "src/bin/tx-ledger.rs"

[lints]
workspace = true
