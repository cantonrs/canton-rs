[package]
name = "canton-participant"
version = "0.8.0"
edition = "2021"
description = "Native Canton participant node, topology manager, and ACS commitment engine"
license = "Apache-2.0"

[features]
# the official-migration tests need a PostgreSQL server and the fetched Canton references: scripts/verify-pg-migrate.sh
postgres = ["dep:postgres", "dep:tokio-postgres-rustls", "dep:rustls"]
pg-tests = ["postgres"]
# a real gRPC client of the official sequencer (G5): scripts/verify-sequencer-connect.sh
sequencer-grpc = ["dep:canton-proto", "dep:tonic", "dep:tokio", "dep:prost", "dep:prost-types", "dep:p256", "dep:zstd", "dep:aes-gcm", "dep:aes", "dep:cbc", "dep:hmac"]
# also gates the tests that read the node values a harness script prints (CANTON_RS_*): they must not run in a plain `cargo test --workspace`, where canton-rs turns sequencer-grpc on
sequencer-tests = ["sequencer-grpc"]

[dependencies]
postgres = { version = "0.19", optional = true }
# a PostgreSQL connection over TLS that checks the server's certificate (G9, AT-D09)
tokio-postgres-rustls = { version = "0.13", optional = true }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"], optional = true }
canton-proto = { path = "../../protocol/canton-proto", features = ["grpc"], optional = true }
tonic = { version = "0.14", features = ["transport", "tls-ring"], optional = true }
tokio = { version = "1", features = ["rt-multi-thread", "time", "net"], optional = true }
prost = { version = "0.14", optional = true }
prost-types = { version = "0.14", optional = true }
p256 = { version = "0.14", features = ["pkcs8", "ecdh"], optional = true }
aes-gcm = { version = "0.10", optional = true }
aes = { version = "0.8", optional = true }
cbc = { version = "0.1", features = ["alloc"], optional = true }
hmac = { version = "0.12", optional = true }
zstd = { version = "0.13", optional = true }
canton-algo = { path = "../canton-algo" }
lf-eval = { path = "../lf-eval" }
sha2 = "0.10"
hex = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
lf-archive = { path = "../lf-archive" }
ed25519-dalek = "2.1"
blake3 = "1"


[dev-dependencies]
# a TLS terminator in front of the sequencer's plaintext port, for the TLS-client test (tests/sequencer_connect.rs)
tokio = { version = "1", features = ["io-util", "net", "rt-multi-thread", "time"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }

[lints]
workspace = true
