[package]
name = "codegen-check"
version = "0.8.0"
edition = "2021"
description = "Compiles the Rust bindings generated from the codegen fixture DAR and checks them against the Daml-LF JSON reader (G10, AT-K05)"
license = "Apache-2.0"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
lf-eval = { path = "../../core/lf-eval" }

[dev-dependencies]
lf-eval = { path = "../../core/lf-eval" }

[lints]
workspace = true
